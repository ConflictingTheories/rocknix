name: Build Anbernic RG353V (RK3566)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build (RK3566 is default; used by Anbernic RG353V)'
        required: false
        default: 'RK3566'
        type: string
      push_image:
        description: 'If true, tag and push the built image to GHCR (requires secret GHCR_PAT)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-rk-device:
    name: Build BASE_ONLY docker for device
    runs-on: ubuntu-24.04
    environment: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name:  Set up QEMU (for cross / multi-arch if needed)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name:  Restore Buildx local cache
        id: restore-buildx-cache
        uses: actions/cache@v4
        with: 
          path: ./.buildx-cache
          key: buildx-cache-${{ runner.os }}-${{ github.ref }}-${{ hashFiles('**/Dockerfile','**/Makefile','**/mk/**') }}
          restore-keys: |
            buildx-cache-${{ runner.os }}-${{ github. ref }}-

      - name:  Restore ccache
        id: restore-ccache
        uses: actions/cache@v4
        with:
          path: ~/. ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.c','**/*.cpp','**/Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Prepare env
        run: |
          echo "DEVICE=${{ github.event.inputs.device || 'RK3566' }}" >> $GITHUB_ENV
          echo "BASE_ONLY=true" >> $GITHUB_ENV

      - name: Show environment
        run: |
          echo "Building device: $DEVICE"
          uname -a
          docker --version
          docker buildx version || true

      - name: Run make (BASE_ONLY=true make docker-<DEVICE>)
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CC: ccache
          CXX: ccache
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          export PATH="/usr/lib/ccache: $PATH" || true
          time BASE_ONLY=true make docker-${DEVICE}

      - name:  Save produced Docker image to tar
        id: save-image
        run: |
          set -euxo pipefail
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}} {{. CreatedAt}}' | grep -i -E 'rk3566|rocknix|docker-rk3566' | head -n1 | awk '{print $1}' || true)
          if [ -z "$IMAGE" ]; then
            IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}} {{. CreatedAt}}' | grep -v '<none>' | head -n1 | awk '{print $1}' || true)
          fi
          if [ -z "$IMAGE" ]; then
            echo "No image found to save" >&2
            exit 1
          fi
          echo "IMAGE_TO_SAVE=$IMAGE" >> $GITHUB_OUTPUT
          docker save "$IMAGE" -o docker-image-${DEVICE}.tar
          ls -lh docker-image-${DEVICE}.tar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rocknix-${{ env.DEVICE }}-artifacts-${{ github.run_id }}
          path: |
            . /*.img
            ./*.img. gz
            ./*.tar
            ROCKNIX-*
            docker-image-${{ env. DEVICE }}.tar

      - name: Persist Buildx local cache
        if: always()
        uses: actions/cache@v4
        with:
          path: ./.buildx-cache
          key: buildx-cache-${{ runner.os }}-${{ github.ref }}-${{ hashFiles('**/Dockerfile','**/Makefile','**/mk/**') }}

      - name: Persist ccache
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.c','**/*.cpp','**/Makefile') }}

      - name: Optionally push image to GHCR
        if: ${{ github.event.inputs.push_image == true }}
        env:
          GHCR_PAT: ${{ secrets. GHCR_PAT }}
        run: |
          set -euxo pipefail
          if [ -z "${GHCR_PAT:-}" ]; then
            echo "GHCR_PAT is not set in secrets; cannot push" >&2
            exit 1
          fi
          IMAGE="${{ steps. save-image.outputs.IMAGE_TO_SAVE }}"
          TARGET=ghcr.io/${{ github.repository_owner }}/rocknix-${{ env. DEVICE }}:${{ github. run_number }}-${{ github.sha::8 }}
          docker tag "$IMAGE" "$TARGET"
          echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$TARGET"
          echo "pushed=$TARGET" >> $GITHUB_OUTPUT

      - name: Summary
        if:  always()
        run: |
          echo "Build finished. Artifacts (including docker-image-${{ env.DEVICE }}.tar) uploaded."
          if [ "${{ github.event. inputs.push_image }}" = "true" ]; then
            echo "If push was requested, image target: ${{ steps.save-image.outputs.IMAGE_TO_SAVE }}"
          fi
